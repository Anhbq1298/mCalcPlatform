name: Platform CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether to run the full Canvas suite
        id: canvas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            push)
              # Compare with the last successful publish so cancelled runs cannot hide changes.
              base=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch=main -f event=push -f status=success -F per_page=1 \
                --jq '.workflow_runs[0].head_sha // empty') || base=
              ;;
            *) base= ;;
          esac

          # Run the suite when the comparison base is unavailable.
          run_full=true
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if changed=$(git diff --name-only --no-renames --ignore-submodules=none "$base" HEAD -- \
              .gitmodules vendor/calccanvas package.json package-lock.json \
              scripts/build.mjs scripts/prepare-tools.mjs scripts/shared-sources.mjs \
              apps/tool-page.mjs packages/design-sdk packages/ui-kit packages/assets \
              assets/sections/steel); then
              if [[ -z "$changed" ]]; then
                run_full=false
              else
                printf 'Canvas-dependent changes:\n%s\n' "$changed"
              fi
            fi
          fi
          printf 'run_full=%s\n' "$run_full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/calccanvas/package-lock.json
      - run: npm ci --prefix vendor/calccanvas
      - run: npm run check-boundaries
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: vendor/calccanvas
      - run: npm run test:browser
      - run: npm run test:legacy
        if: steps.canvas.outputs.run_full == 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-traces
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
