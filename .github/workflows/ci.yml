name: Platform CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vendor/calccanvas/package-lock.json
      - run: npm ci --prefix vendor/calccanvas
      - run: npm run check-boundaries
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: vendor/calccanvas
      - run: npm run test:browser
      - run: npm run test:legacy
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-browser-traces
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
