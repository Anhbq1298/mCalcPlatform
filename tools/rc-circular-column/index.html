<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mConcreteCircCol</title>
</head>
<body>
  <header class="titlebar">
    <h1>mConcreteCircCol <span>Circular RC Column</span></h1>
    <output id="calculation-status" aria-live="polite">Preparing worksheet</output>
  </header>
  <main class="column-layout">
    <form id="column-inputs" aria-label="Column inputs"></form>
    <section class="section-view" aria-labelledby="section-title">
      <h2 id="section-title">Section — circular closed links</h2>
      <div id="circular-section" role="img" aria-label="Circular concrete section" aria-describedby="section-legend"></div>
      <p id="section-legend"></p>
    </section>
    <section class="checks" aria-labelledby="results-title">
      <h2 id="results-title">Check summary</h2>
      <p>PMM/shear: EC2:2023 · Detailing: EC2:2004 · Project NA requires review</p>
      <div id="column-check-summary" aria-live="polite"></div>
      <h2 class="detail-title">Shear details</h2>
      <dl id="checks"></dl>
    </section>
    <section class="interaction" aria-labelledby="interaction-title">
      <div class="charthead">
        <h2 id="interaction-title">P–M at governing angle</h2>
        <label><span>Grid P (kN)</span><input id="gridPmP" aria-label="Grid P (kN)" type="number" min="0" step="500" placeholder="auto"></label>
        <label><span>M (kNm)</span><input id="gridPmM" aria-label="Grid M (kNm)" type="number" min="0" step="50" placeholder="auto"></label>
      </div>
      <canvas id="interaction-curve" role="img" aria-label="Axial force versus moment about the applied bending direction"></canvas>
      <p id="pm-caption"></p>
    </section>
  </main>
  <script type="module" src="/platform/tools/rc-circular-column/src/page.mjs"></script>
</body>
</html>
