<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mConcreteCircCol</title>
</head>
<body>
  <header class="titlebar">
    <h1>mConcreteCircCol <span>Circular RC Column</span></h1>
    <output id="calculation-status" aria-live="polite">Preparing worksheet</output>
  </header>
  <main class="column-layout">
    <form id="column-inputs" aria-label="Column inputs"></form>
    <section class="section-view" aria-labelledby="section-title">
      <h2 id="section-title">Section and spirals</h2>
      <canvas id="circular-section" role="img" aria-label="Circular concrete section" aria-describedby="section-legend"></canvas>
      <p id="section-legend"></p>
    </section>
    <section class="checks" aria-labelledby="results-title">
      <h2 id="results-title">Check summary</h2>
      <p>EN 1992-1-1:2023 · One design load case</p>
      <div id="column-check-summary" aria-live="polite"></div>
      <h2 class="detail-title">Shear details</h2>
      <dl id="checks"></dl>
    </section>
    <section class="interaction" aria-labelledby="interaction-title">
      <h2 id="interaction-title">Axial force–moment interaction</h2>
      <canvas id="interaction-curve" role="img" aria-label="Axial force versus moment about the applied bending direction"></canvas>
      <p>Blue: resistance curve. Red: applied load.</p>
    </section>
  </main>
  <script type="module" src="/platform/tools/rc-circular-column/src/page.mjs"></script>
</body>
</html>
